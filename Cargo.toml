[workspace]
resolver = "3"
members = ["libs/cassio", "userspace/core/ns", "userspace/drivers/ata", "userspace/drivers/kbd", "userspace/drivers/mouse"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
